<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="dg-t">
      <title id="dg-t">Pipeline: the workflow export and signed spec go into generate_uat.py, which parses, validates and derives tests, producing the UAT workbook and a JSON summary. Claude briefs the user from the summary, applies fixes to a copy of the workflow, and re-runs.</title>
      <rect width="1040" height="300" rx="12" fill="#FFFFFF"/><defs>
        <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#586079"/></marker>
      </defs>
      <g font-family="IBM Plex Mono, monospace" font-size="13">
        <rect x="10" y="40" width="200" height="56" rx="8" fill="#EEF0F7" stroke="#DEE2EE"/>
        <text x="110" y="64" text-anchor="middle" fill="#0F172A">workflow.json</text>
        <text x="110" y="83" text-anchor="middle" fill="#586079" font-size="11">what was built</text>
        <rect x="10" y="124" width="200" height="56" rx="8" fill="#EEF0F7" stroke="#DEE2EE"/>
        <text x="110" y="148" text-anchor="middle" fill="#0F172A">requirements.json</text>
        <text x="110" y="167" text-anchor="middle" fill="#586079" font-size="11">what was signed</text>
        <path d="M210 68 C 250 68, 250 110, 290 110" fill="none" stroke="#586079" stroke-width="1.6" marker-end="url(#ar)"/>
        <path d="M210 152 C 250 152, 250 110, 290 110" fill="none" stroke="#586079" stroke-width="1.6" marker-end="url(#ar)"/>
        <rect x="292" y="40" width="250" height="140" rx="10" fill="#4F46E5"/>
        <text x="417" y="70" text-anchor="middle" fill="#FFFFFF" font-weight="500" font-size="14">generate_uat.py</text>
        <text x="317" y="102" fill="#FFFFFF" font-size="12">1  parse the export</text>
        <text x="317" y="126" fill="#FFFFFF" font-size="12">2  validate against the spec</text>
        <text x="317" y="150" fill="#FFFFFF" font-size="12">3  derive test cases</text>
        <path d="M542 85 L 600 70" fill="none" stroke="#586079" stroke-width="1.6" marker-end="url(#ar)"/>
        <path d="M542 140 L 600 155" fill="none" stroke="#586079" stroke-width="1.6" marker-end="url(#ar)"/>
        <rect x="602" y="40" width="190" height="56" rx="8" fill="#EEF0F7" stroke="#DEE2EE"/>
        <text x="697" y="64" text-anchor="middle" fill="#0F172A">UAT workbook</text>
        <text x="697" y="83" text-anchor="middle" fill="#586079" font-size="11">8 tabs · .xlsx</text>
        <rect x="602" y="128" width="190" height="56" rx="8" fill="#EEF0F7" stroke="#DEE2EE"/>
        <text x="697" y="152" text-anchor="middle" fill="#0F172A">JSON summary</text>
        <text x="697" y="171" text-anchor="middle" fill="#586079" font-size="11">verdict · checks · counts</text>
        <path d="M792 156 L 842 156" fill="none" stroke="#586079" stroke-width="1.6" marker-end="url(#ar)"/>
        <rect x="844" y="104" width="186" height="104" rx="10" fill="#FFFFFF" stroke="#4F46E5" stroke-width="2"/>
        <text x="937" y="130" text-anchor="middle" fill="#4F46E5" font-weight="500" font-size="14">Claude</text>
        <text x="860" y="155" fill="#0F172A" font-size="11.5">briefs the verdict</text>
        <text x="860" y="175" fill="#0F172A" font-size="11.5">fixes FAILs on a copy</text>
        <text x="860" y="195" fill="#0F172A" font-size="11.5">re-runs</text>
        <path d="M937 208 C 937 270, 417 270, 417 184" fill="none" stroke="#4F46E5" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)"/>
        <text x="677" y="262" text-anchor="middle" fill="#4F46E5" font-size="12">fixed workflow → same check IDs, FAIL count to 0</text>
      </g>
    </svg>